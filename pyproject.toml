[project]
name = "rotationchaos"
version = "0.1.0"
description = "Workload identity with 60-second certificates and injected rotation failures - so the rotation path is exercised thousands of times, not once a year."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
